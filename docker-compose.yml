name: cmul8

x-cmul8-environment: &cmul8-environment

  CMUL8_MISSION_ISOLATION_LAUNCHER: /opt/cmul8/bin/cmul8-mission-sandbox
  CMUL8_DEPLOYMENT_MODE: private_cloud
  CMUL8_TENANT_ID: ${CMUL8_TENANT_ID:-default}
  CMUL8_ENVIRONMENT: ${CMUL8_ENVIRONMENT:-production}
  CMUL8_POSTGRES_URL: postgresql://cmul8:${CMUL8_POSTGRES_PASSWORD:?set CMUL8_POSTGRES_PASSWORD}@postgres:5432/cmul8
  CMUL8_REDIS_URL: redis://redis:6379/0
  CMUL8_SECRET_PROVIDER: compose_env
  CMUL8_TLS_REQUIRED: ${CMUL8_TLS_REQUIRED:-true}
  SIMULACRA_DATABASE_URL: postgresql://cmul8:${CMUL8_POSTGRES_PASSWORD}@postgres:5432/cmul8
  SIMULACRA_AUTH_REQUIRED: "1"
  CMUL8_AGENT_HARNESS: ${CMUL8_AGENT_HARNESS:-codex}
  CMUL8_MODEL_PROVIDER: ${CMUL8_MODEL_PROVIDER:-openai}
  CMUL8_MODEL: ${CMUL8_MODEL:-default}
  CMUL8_MODEL_BASE_URL: ${CMUL8_MODEL_BASE_URL:-}
  CMUL8_MODEL_API_KEY_ENV: ${CMUL8_MODEL_API_KEY_ENV:-}
  CMUL8_MODEL_API_KEY: ${CMUL8_MODEL_API_KEY:-}
  CMUL8_MODEL_REASONING_EFFORT: ${CMUL8_MODEL_REASONING_EFFORT:-}
  CMUL8_CODEX_BIN: /opt/codex/bin/codex
  CODEX_HOME: /app/data/codex
  # One-shot manifests and private per-Mission-agent Codex homes live outside /app/runs.
  CMUL8_MISSION_RUNTIME_ROOT: /app/data/mission-runtime
  CMUL8_MISSION_CRON_INTERVAL_SECONDS: ${CMUL8_MISSION_CRON_INTERVAL_SECONDS:-15}
  SIMULACRA_SANDBOX: worktree
  SIMULACRA_DATA_DIR: /app/data
  SIMULACRA_RUNS_DIR: /app/runs
  CMUL8_RUNTIME_ROOT: /app/runs/.cmul8-runtime
  CMUL8_TELEMETRY_ROOT: /app/runs/.cmul8-telemetry
  SIMULACRA_BOOTSTRAP_EMAIL: ${SIMULACRA_BOOTSTRAP_EMAIL:-admin@localhost}
  SIMULACRA_BOOTSTRAP_PASSWORD: ${SIMULACRA_BOOTSTRAP_PASSWORD:?set SIMULACRA_BOOTSTRAP_PASSWORD}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

x-cmul8-service: &cmul8-service
  image: ${CMUL8_IMAGE:-cmul8:local}
  build: .
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: *cmul8-environment
  volumes:
    - cmul8-data:/app/data
    - cmul8-runs:/app/runs

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmul8
      POSTGRES_PASSWORD: ${CMUL8_POSTGRES_PASSWORD}
      POSTGRES_DB: cmul8
    volumes:
      - cmul8-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmul8 -d cmul8"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - cmul8-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *cmul8-service
    restart: "no"
    command: ["migrations"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *cmul8-service
    command: ["api"]
    ports:
      - "${CMUL8_BIND_ADDRESS:-127.0.0.1}:${CMUL8_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  worker:
    <<: *cmul8-service
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/cmul8/bin/cmul8-worker-health", "--ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  cmul8-data:
  cmul8-runs:
  cmul8-postgres:
  cmul8-redis:
