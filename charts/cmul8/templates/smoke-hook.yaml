{{- if .Values.smoke.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cmul8.fullname" . }}-smoke-{{ .Release.Revision }}
  labels:
    {{- include "cmul8.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade,post-rollback
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.smoke.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "cmul8.labels" . | nindent 8 }}
        app.kubernetes.io/component: smoke
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "cmul8.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: smoke
          image: {{ include "cmul8.image" . | quote }}
          args: ["smoke"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "cmul8.env" . | nindent 12 }}
            {{- range $name, $path := .Values.smoke.paths }}
            - name: CMUL8_SMOKE_{{ $name | upper }}_URL
              value: {{ printf "http://%s-api:%v%s" (include "cmul8.fullname" $) $.Values.service.apiPort $path | quote }}
            {{- end }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
{{- end }}
