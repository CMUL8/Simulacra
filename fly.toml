# fly.toml app configuration file generated for Simulacra
app = "cmul8-simulacra"
primary_region = "iad"

[build]

[env]
  SIMULACRA_AUTH_REQUIRED = "1"
  SIMULACRA_SANDBOX = "machine"
  SIMULACRA_MACHINE_PROVIDER = "local"
  SIMULACRA_DEFAULT_TENANT = "default"
  # Set SIMULACRA_DATABASE_URL via `fly secrets set`
  # Set SIMULACRA_SIEM_WEBHOOK / SIMULACRA_SIEM_TOKEN via secrets for SIEM forward
  # For Fly ephemeral workers: FLY_API_TOKEN + SIMULACRA_FLY_APP + SIMULACRA_MACHINE_PROVIDER=fly

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
