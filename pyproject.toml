[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulacra"
version = "0.1.0"
description = "Python wrapper around Prime Agent for programmatic and multi-agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Simulacra" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
simulacra = "simulacra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["simulacra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
